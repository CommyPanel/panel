# Critical PHP security flaws that the installed PHP must have fixed.
#
# One line per flaw: the CVE id, then for each PHP branch the first upstream
# version that contains the fix (branch=version), and optionally the first
# distribution package build that has it (deb:package=version). The installer
# treats a server as fixed when its PHP is at least that upstream version, or
# when the package changelog names the CVE, or when the installed package is at
# least that build. Ubuntu and Debian backport fixes without changing the upstream
# version number (Ubuntu stays 8.5.4), so `php -v` alone cannot tell. A branch that
# is not listed is not checked.
#
# Add a line when a new critical flaw is announced.

# PHP2Shell: unauthenticated remote code execution (fixed upstream 2026-10-21;
