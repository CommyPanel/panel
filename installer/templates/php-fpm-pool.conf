; Managed by CommyPanel. A dedicated pool for the panel.
[commypanel]
user = commypanel
group = commypanel

listen = /run/php/commypanel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 30s
pm.max_requests = 500

clear_env = no
env[LARAVEL_STORAGE_PATH] = @@DATA_DIR@@/storage

php_admin_value[expose_php] = Off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 1

; Hardening against the PHP2Shell flaws (CVE-2026-109618, CVE-2026-109619). The
; real fix is an updated PHP (the installer checks for it); these close the two
; request paths PHP's own advisory names, and the panel uses neither.
php_admin_value[session.upload_progress.enabled] = 0
@@PHP85_ONLY@@php_admin_value[fatal_error_backtraces] = 0
