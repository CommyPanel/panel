# Managed by CommyPanel. The panel's own web interface.
server {
    listen @@PANEL_PORT@@ ssl;
    listen [::]:@@PANEL_PORT@@ ssl;
    # Loopback only. The panel's own domain (443) is an agent-managed site that proxies here.
    listen 127.0.0.1:@@PANEL_INTERNAL_PORT@@;
    server_name _;

    ssl_certificate @@CONF_DIR@@/tls/panel.crt;
    ssl_certificate_key @@CONF_DIR@@/tls/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root @@PREFIX@@/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only index.php may run; any other .php request is a 404.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/commypanel.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        # Cookies and long headers must not become a 502: nginx's default 4k buffer
        # for the response headers ("upstream sent too big header") is easy to outgrow.
        fastcgi_buffer_size 16k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
