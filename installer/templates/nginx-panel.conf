# Managed by CommyPanel. The panel's own web interface.
server {
    listen @@PANEL_PORT@@ ssl;
    listen [::]:@@PANEL_PORT@@ ssl;
    # Loopback only. The panel's own domain (443) is an agent-managed site that proxies here.
    listen 127.0.0.1:@@PANEL_INTERNAL_PORT@@;
    server_name _;

    ssl_certificate @@CONF_DIR@@/tls/panel.crt;
    ssl_certificate_key @@CONF_DIR@@/tls/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root @@PREFIX@@/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Browser terminals: a WebSocket to the agent's terminal socket, which only
    # accepts a single-use ticket from the panel.
    location = /terminal {
        proxy_pass http://unix:/run/commypanel-terminal/terminal.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_buffering off;
    }

    # Only index.php may run; any other .php request is a 404.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/commypanel.sock;
        include fastcgi_params;
        # Debian's nginx 1.26 package sets HTTP_HOST to $host, which drops the port, so every
        # link the panel builds on its own port (8443) would point at port 443.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        # Cookies and long headers must not become a 502: nginx's default 4k buffer
        # for the response headers ("upstream sent too big header") is easy to outgrow.
        # The buffers must grow with it: nginx refuses a header buffer that leaves
        # too little of the 8 x 4k default for its busy-buffer limit.
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# Database tools (phpMyAdmin, Adminer). They are served on a port of their own, which a
# browser treats as another website than the panel, so a tool can never act as the panel
# even if it were fooled by what a database holds. Everything goes to the agent's tool
# socket, which accepts only a single-use ticket and the cookie it hands out. When the
# panel has a domain, the agent adds a server for it on this same port with its certificate.
server {
    listen @@TOOLS_PORT@@ ssl default_server;
    listen [::]:@@TOOLS_PORT@@ ssl default_server;
    server_name _;

    ssl_certificate @@CONF_DIR@@/tls/panel.crt;
    ssl_certificate_key @@CONF_DIR@@/tls/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 130m;

    location / {
        proxy_pass http://unix:/run/commypanel-dbtool/dbtool.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
