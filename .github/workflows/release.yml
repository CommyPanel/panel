name: release

# Builds the release tarball when a version tag is pushed and publishes it,
# with its checksum and the one-line installer, as a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run the tests
        run: |
          composer setup
          composer ci:check
          cd agent && go vet ./... && go test ./...

      - name: Build the release
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          title="CommyPanel $version"
          flags=(--verify-tag)
          : > release-notes.md

          # A tag with a dash (v0.2.0-rc.1) is a release candidate. It is published
          # as a pre-release, so "latest" and the one-line installer keep pointing at
          # the newest stable release, and it gets a banner saying how to install it.
          if [[ "$tag" == *-* ]]; then
            title="$title (release candidate)"
            flags+=(--prerelease)
            sed -e "s|@TAG@|$tag|g" -e "s|@VERSION@|$version|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              .github/prerelease-banner.md >> release-notes.md
          fi

          # Hand-written notes are docs/releases/<stable version>.md, shared by a
          # release and its candidates (v0.2.0-rc.1 uses v0.2.0.md).
          notes="docs/releases/${tag%%-*}.md"
          if [ -f "$notes" ]; then
            cat "$notes" >> release-notes.md
          fi

          if [ -s release-notes.md ]; then
            flags+=(--notes-file release-notes.md)
          else
            flags+=(--generate-notes)
          fi

          gh release create "$tag" \
            dist/commypanel.tar.gz dist/commypanel.tar.gz.sha256 dist/install.sh \
            --title "$title" "${flags[@]}"
