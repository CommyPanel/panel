name: release

# Builds the release tarball when a version tag is pushed and publishes it,
# with its checksum, signatures and the one-line installer, as a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run the tests
        run: |
          composer setup
          composer ci:check
          cd agent && go vet ./... && go test ./...

      - name: Build the release
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist

      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Ed25519 signatures of the tarball and of its checksum file. The installer
          # checks the tarball's signature against the key built into it; the second
          # one is for people who verify by hand. The private key lives only in this
          # step: it is written with mode 0600, used once and removed.
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "The repository secret RELEASE_SIGNING_KEY is missing (see scripts/generate-signing-key.sh)." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing.key"
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          for file in commypanel.tar.gz commypanel.tar.gz.sha256; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "dist/$file" -out "dist/$file.sig"
          done
          rm -f "$key"

          # The signature must verify with the public key that ships in this commit,
          # or every installer would refuse the release.
          for file in commypanel.tar.gz commypanel.tar.gz.sha256; do
            openssl pkeyutl -verify -pubin -inkey installer/release-key.pub -rawin \
              -in "dist/$file" -sigfile "dist/$file.sig"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          title="CommyPanel $version"
          flags=(--verify-tag)
          : > release-notes.md

          # A tag with a dash (v0.2.0-rc.1) is a release candidate. It is published
          # as a pre-release, so "latest" and the one-line installer keep pointing at
          # the newest stable release, and it gets a banner saying how to install it.
          if [[ "$tag" == *-* ]]; then
            title="$title (release candidate)"
            flags+=(--prerelease)
            sed -e "s|@TAG@|$tag|g" -e "s|@VERSION@|$version|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              .github/prerelease-banner.md >> release-notes.md
          fi

          # Hand-written notes are docs/releases/<stable version>.md, shared by a
          # release and its candidates (v0.2.0-rc.1 uses v0.2.0.md).
          notes="docs/releases/${tag%%-*}.md"
          if [ -f "$notes" ]; then
            cat "$notes" >> release-notes.md
          fi

          if [ -s release-notes.md ]; then
            flags+=(--notes-file release-notes.md)
          else
            flags+=(--generate-notes)
          fi

          gh release create "$tag" \
            dist/commypanel.tar.gz dist/commypanel.tar.gz.sha256 dist/commypanel.tar.gz.sig \
            dist/commypanel.tar.gz.sha256.sig dist/install.sh \
            --title "$title" "${flags[@]}"
